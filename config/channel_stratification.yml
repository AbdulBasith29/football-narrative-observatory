# --- FROZEN METHODOLOGY INVARIANTS (Frozen for Version 1.1/1.2) ---
frozen_parameters:
  # Player Focus smoothed ratio: (V_1 + alpha) / (V_2 + alpha)
  smoothing_alpha: 1.0

  # Player dominance ratio threshold
  player_focus_ratio_threshold: 4.0

  # Player prevalence floor for focus classification
  player_prevalence_floor: 0.15

  # Club dominance proportion threshold
  club_dominance_threshold: 0.70

  # Minimum distinct video evidence requirements
  min_videos_primary_90d: 10
  min_videos_fallback_180d: 10

  # Temporal subwindow duration for stability evaluation
  subwindow_duration_days: 30

  # Standard pre-event exclusion buffer
  exclusion_buffer_hours: 24
